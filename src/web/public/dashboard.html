<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecionar Servidor - Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="/" class="nav-brand">
      <img id="bot-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Bot Logo">
      <span>Dashboard</span>
    </a>
    <div class="nav-user">
      <div class="user-badge" id="user-profile">
        <img id="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
        <span id="user-name">Carregando...</span>
      </div>
      <a href="/auth/logout" class="btn btn-secondary" title="Sair"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800;">Selecione um Servidor</h1>
        <p style="color: var(--text-muted); margin-top: 4px;">Escolha o servidor que deseja configurar ou adicione o bot a uma nova comunidade.</p>
      </div>
    </div>

    <!-- SERVIDORES ATIVOS -->
    <h2 class="section-title">
      <i class="fa-solid fa-circle-check" style="color: var(--success);"></i> Servidores Ativos 
      <span class="badge" id="active-count">0</span>
    </h2>
    <div class="guilds-grid" id="active-guilds-list">
      <div style="color: var(--text-muted); grid-column: 1 / -1; padding: 2rem 0;">
        <i class="fa-solid fa-spinner fa-spin"></i> Carregando seus servidores...
      </div>
    </div>

    <!-- SERVIDORES PARA CONVIDAR -->
    <h2 class="section-title" style="margin-top: 3.5rem;">
      <i class="fa-solid fa-plus-circle" style="color: var(--primary);"></i> Adicionar Bot a Outros Servidores
      <span class="badge" id="uninvited-count">0</span>
    </h2>
    <div class="guilds-grid" id="uninvited-guilds-list">
      <div style="color: var(--text-muted); grid-column: 1 / -1; padding: 2rem 0;">
        <i class="fa-solid fa-spinner fa-spin"></i> Carregando lista...
      </div>
    </div>
  </main>

  <script>
    async function loadDashboard() {
      try {
        // Validação de Sessão
        const userRes = await fetch('/api/user');
        if (userRes.status === 401) {
          window.location.href = '/auth/login';
          return;
        }
        const userData = await userRes.json();
        document.getElementById('user-avatar').src = userData.user.avatar;
        document.getElementById('user-name').innerText = userData.user.global_name;

        // Avatar do Bot
        const statsRes = await fetch('/api/stats');
        const statsData = await statsRes.json();
        if (statsData.avatar) document.getElementById('bot-avatar').src = statsData.avatar;

        // Lista de Servidores
        const guildsRes = await fetch('/api/guilds');
        const guildsData = await guildsRes.json();

        // 1. Renderiza Servidores Ativos
        const activeContainer = document.getElementById('active-guilds-list');
        document.getElementById('active-count').innerText = guildsData.activeGuilds.length;

        if (guildsData.activeGuilds.length === 0) {
          activeContainer.innerHTML = `
            <div style="grid-column: 1 / -1; padding: 2rem; background: var(--bg-card); border-radius: var(--radius); border: 1px dashed var(--border-color); text-align: center;">
              <p style="color: var(--text-muted);">Você ainda não possui nenhum servidor com o bot adicionado.</p>
            </div>
          `;
        } else {
          activeContainer.innerHTML = guildsData.activeGuilds.map(g => `
            <div class="guild-card active">
              <div style="position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 6px; background: rgba(35, 165, 90, 0.12); padding: 3px 8px; border-radius: 20px; font-size: 0.75rem; color: var(--success); font-weight: 600; border: 1px solid rgba(35, 165, 90, 0.3);">
                <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success);"></span> Ativo
              </div>
              <img src="${g.icon}" class="guild-icon" alt="${g.name}">
              <div class="guild-name" title="${g.name}">${g.name}</div>
              <div class="guild-info"><i class="fa-solid fa-users"></i> ${g.memberCount || 0} membros</div>
              <a href="/dashboard/${g.id}" class="btn btn-success"><i class="fa-solid fa-sliders"></i> Gerenciar</a>
            </div>
          `).join('');
        }

        // 2. Renderiza Servidores para Convidar
        const uninvitedContainer = document.getElementById('uninvited-guilds-list');
        document.getElementById('uninvited-count').innerText = guildsData.uninvitedGuilds.length;

        if (guildsData.uninvitedGuilds.length === 0) {
          uninvitedContainer.innerHTML = `
            <div style="grid-column: 1 / -1; padding: 2rem; background: var(--bg-card); border-radius: var(--radius); border: 1px dashed var(--border-color); text-align: center;">
              <p style="color: var(--text-muted);">Você já adicionou o bot em todos os servidores onde é Administrador!</p>
            </div>
          `;
        } else {
          uninvitedContainer.innerHTML = guildsData.uninvitedGuilds.map(g => `
            <div class="guild-card uninvited">
              <img src="${g.icon}" class="guild-icon" alt="${g.name}">
              <div class="guild-name" title="${g.name}">${g.name}</div>
              <div class="guild-info"><i class="fa-solid fa-shield-halved"></i> Administrador</div>
              <a href="${g.inviteUrl}" target="_blank" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Convidar Bot</a>
            </div>
          `).join('');
        }

      } catch (err) {
        console.error('Erro ao carregar dashboard:', err);
      }
    }
    loadDashboard();
  </script>
</body>
</html>
